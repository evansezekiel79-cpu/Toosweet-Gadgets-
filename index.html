<style>
  .toosweet-gallery {
    width: min(92vw, 500px);
    margin: 15px auto 25px;
    padding: 6px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    border-radius: 14px;
    overflow: hidden;
    background: #f2f2f2;

  }

  .toosweet-gallery img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    border-radius: 8px;
  }

  @media (max-width: 400px) {

      width: 94vw;
      gap: 4px;
      padding: 4px;
    }

    .toosweet-gallery img {
      border-radius: 6px;
    }
  }
</style>
