
<script>

/* =========================
   TOOSWEET GADGETS CART
========================= */

var cart = [];


/* Load saved cart */

try {

    var saved = localStorage.getItem("toosweet_cart");

    if (saved) {
        cart = JSON.parse(saved);
    }

} catch (error) {

    cart = [];

}


/* Save cart */

function saveCart() {

    try {

        localStorage.setItem(
            "toosweet_cart",
            JSON.stringify(cart)
        );

    } catch (error) {

        console.log("Could not save cart");

    }

}


/* Add to cart */

function addToCart(name, image) {

    var found = false;

    for (var i = 0; i < cart.length; i++) {

        if (cart[i].name === name) {

            cart[i].quantity =
                cart[i].quantity + 1;

            found = true;

            break;
        }

    }


    if (!found) {

        cart.push({

            name: name,
            image: image,
            quantity: 1

        });

    }


    saveCart();

    updateCart();

    openCart();

}


/* Update cart */

function updateCart() {

    var count = 0;

    for (var i = 0; i < cart.length; i++) {

        count =
            count + cart[i].quantity;

    }


    document.getElementById(
        "cartCount"
    ).innerHTML = count;


    showCart();

}


/* Show cart */

function showCart() {

    var box =
        document.getElementById("cartItems");


    if (cart.length === 0) {

        box.innerHTML =

        '<div class="empty-cart">' +

        '<div class="empty-cart-icon">🛒</div>' +

        '<h3>Your cart is empty</h3>' +

        '<p>Add a gadget to your cart.</p>' +

        '</div>';

        return;

    }


    var html = "";


    for (var i = 0; i < cart.length; i++) {

        html +=

        '<div class="cart-item">' +

        '<img class="cart-item-image" ' +
        'src="' + cart[i].image + '" ' +
        'alt="' + cart[i].name + '">' +

        '<div class="cart-item-details">' +

        '<h3>' +
        cart[i].name +
        '</h3>' +

        '<p>Price: Contact us</p>' +

        '<div class="quantity-controls">' +

        '<button type="button" ' +
        'onclick="changeQuantity(' +
        i +
        ',-1)">−</button>' +

        '<span class="quantity-number">' +
        cart[i].quantity +
        '</span>' +

        '<button type="button" ' +
        'onclick="changeQuantity(' +
        i +
        ',1)">+</button>' +

        '</div>' +

        '<button type="button" ' +
        'class="remove-item" ' +
        'onclick="removeItem(' +
        i +
        ')">' +

        'Remove' +

        '</button>' +

        '</div>' +

        '</div>';

    }


    box.innerHTML = html;

}


/* Increase / decrease */

function changeQuantity(index, amount) {

    if (!cart[index]) {
        return;
    }


    cart[index].quantity =
        cart[index].quantity + amount;


    if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

    }


    saveCart();

    updateCart();

}


/* Remove item */

function removeItem(index) {

    if (!cart[index]) {
        return;
    }


    cart.splice(index, 1);

    saveCart();

    updateCart();

}


/* Clear cart */

function clearCart() {

    cart = [];

    saveCart();

    updateCart();

}


/* Open cart */

function openCart() {

    document
    .getElementById("cartOverlay")
    .classList.add("show");

    showCart();

}


/* Close cart */

function closeCart() {

    document
    .getElementById("cartOverlay")
    .classList.remove("show");

}


/* Close when clicking outside */

function outsideCart(event) {

    if (
        event.target.id ===
        "cartOverlay"
    ) {

        closeCart();

    }

}


/* Send order to WhatsApp */

function sendOrderToWhatsApp() {

    if (cart.length === 0) {

        alert(
            "Your cart is empty. Please add a product first."
        );

        return;

    }


    var message =
        "Hello Toosweet Gadgets!%0A%0A" +
        "I would like to order:%0A%0A";


    for (var i = 0; i < cart.length; i++) {

        message +=
            (i + 1) +
            ". " +
            cart[i].name +
            " x" +
            cart[i].quantity +
            "%0A";

    }


    message +=
        "%0APlease send me the current prices, availability and delivery information.";


    window.location.href =
        "https://wa.me/2348129720470?text=" +
        message;

}


/* =========================
   SEARCH
========================= */

function searchProducts() {

    var search =
        document
        .getElementById("search")
        .value
        .toLowerCase();


    var products =
        document.querySelectorAll(".product");


    products.forEach(function(product) {

        var text =
            product.innerText.toLowerCase();


        if (text.indexOf(search) !== -1) {

            product.style.display = "";

        } else {

            product.style.display = "none";

        }

    });

}


/* =========================
   CATEGORY FILTER
========================= */

function filterCategory(category, button) {

    document
    .querySelectorAll(".category")
    .forEach(function(btn) {

        btn.classList.remove("active");

    });


    button.classList.add("active");


    document.getElementById(
        "search"
    ).value = "";


    document
    .querySelectorAll(".product")
    .forEach(function(product) {

        if (
            category === "all" ||
            product.dataset.category === category
        ) {

            product.style.display = "";

        } else {

            product.style.display = "none";

        }

    });

}


/* Start cart */

updateCart();

       </script>
